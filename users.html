<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Employees</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/css/Users.css">

</head>


<body class="bg-dark">

    <div class="header">

        <nav
            class="navbar navbar-expand-lg sticky-top bg-dark border-bottom border-body"
            data-bs-theme="dark">

            <div class="container-fluid">

                <a
                    class="navbar-brand"
                    href="index.html">

                    Boss Dashboard

                </a>


                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>


                <div
                    class="collapse navbar-collapse"
                    id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="index.html">

                                Tasks

                            </a>

                        </li>


                        <li class="nav-item">

                            <a
                                class="nav-link active"
                                href="users.html">

                                Employees

                            </a>

                        </li>

                    </ul>


                    <button
                        type="button"
                        class="btn btn-primary ms-auto"
                        data-bs-toggle="modal"
                        data-bs-target="#userModal"
                        id="addUserButton">

                        + Add Employee

                    </button>

                </div>

            </div>

        </nav>

    </div>

    <div class="container mt-4">

        <div class="content">

            <table
                class="table table-dark table-striped align-middle">

                <thead>

                    <tr>

                        <th>#</th>
                        <th>First</th>
                        <th>Last</th>
                        <th>Gender</th>
                        <th>Age</th>
                        <th>Job Title</th>
                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="userTableBody"></tbody>

            </table>

        </div>

    </div>

    <div
        class="modal fade"
        id="userModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content bg-dark text-light">


                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="userModalLabel">

                        Add New Employee

                    </h5>


                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <form id="userForm">

                    <div class="modal-body">

                        <div class="mb-3">

                            <label
                                for="fname"
                                class="form-label">

                                First Name

                            </label>

                            <input
                                type="text"
                                class="form-control bg-dark text-white border-secondary"
                                id="fname"
                                required>

                        </div>
                        <div class="mb-3">

                            <label
                                for="lname"
                                class="form-label">

                                Last Name

                            </label>

                            <input
                                type="text"
                                class="form-control bg-dark text-white border-secondary"
                                id="lname"
                                required>

                        </div>

                        <div class="mb-3">

                            <label
                                for="gender"
                                class="form-label">

                                Gender

                            </label>


                            <select
                                class="form-select bg-dark text-white border-secondary"
                                id="gender"
                                required>

                                <option
                                    value=""
                                    selected
                                    disabled>

                                    Select gender

                                </option>

                                <option value="MALE">
                                    Male
                                </option>

                                <option value="FEMALE">
                                    Female
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label
                                for="age"
                                class="form-label">

                                Age

                            </label>


                            <input
                                type="number"
                                class="form-control bg-dark text-white border-secondary"
                                id="age"
                                min="1"
                                required>

                        </div>
                        <div class="mb-3">

                            <label
                                for="job_title"
                                class="form-label">

                                Job Title

                            </label>


                            <input
                                type="text"
                                class="form-control bg-dark text-white border-secondary"
                                id="job_title"
                                required>

                        </div>

                    </div>
                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-outline-light"
                            data-bs-dismiss="modal">

                            Cancel

                        </button>


                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="userSubmitButton">

                            Add Employee

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script
        type="module"
        src="src/users_main.js">
    </script>

</body>

</html>
