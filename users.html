</head>
<body class="bg-dark">
<div class="header">
    <nav class="navbar navbar-expand-lg sticky-top bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Boss Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">

                        <a class="nav-link active" aria-current="page" href="users.html">Users</a>
                    </li>
                </ul>
               
                
                
            </div>
        </div>
    </nav>
</div>


   <div class="container d-flex justify-content-center align-items-center">

   <div class="card text-center p-5 shadow-sm border-0">

        <h1 class="mb-3">Welcome!</h1>

        <p class="text-muted" style="color: aliceblue;">
            Welcome to our Employee Management System
        </p>

       <button type="button"
        class="btn btn-primary mt-3"
        data-bs-toggle="modal"
        data-bs-target="#addUserModal">
    Add User
</button>

    </div>

</div>







    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">

            <div class="modal-header">
                <h5 class="modal-title" id="addUserModalLabel">
                    Add New User
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>

            <form id="userForm">

                <div class="modal-body">

                    <div class="mb-3">
                        <label for="firstName" class="form-label">
                            First Name
                        </label>

                        <input type="text"
                               class="form-control bg-dark text-white border-secondary"
                               id="firstName"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="lastName" class="form-label">
                            Last Name
                        </label>

                        <input type="text"
                               class="form-control bg-dark text-white border-secondary"
                               id="lastName"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="taskDescription" class="form-label">
                            Task
                        </label>

                        <textarea
                            class="form-control bg-dark text-white border-secondary"
                            id="taskDescription"
                            rows="3"
                            required>
                        </textarea>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-outline-light"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Add User
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/lib.js"></script>
    <script src="src/main.js"></script>
</body>
